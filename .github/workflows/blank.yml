name: AWS OIDC Connection Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-connection-test:
    name: Test AWS Connection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display OIDC Claims
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          echo "$TOKEN" | cut -d '.' -f2 | \
            tr '_-' '/+' | \
            awk '{l=length($0)%4; if(l==2) $0=$0"=="; else if(l==3) $0=$0"="; print}' | \
            base64 -d 2>/dev/null | jq '{
              aud,
              sub,
              repository,
              repository_id,
              repository_owner,
              repository_owner_id,
              ref
            }'
